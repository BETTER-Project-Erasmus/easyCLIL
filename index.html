<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>easyCLIL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="home-page">

<header class="header">
  <img src="IMG/Logo_medium.png" alt="easyCLIL logo" class="logo-left">
  <div class="header-title">
    <h1>easyCLIL</h1>
    <p>CLIL is easy!</p>
  </div>
  <img src="IMG/logoBETTER.png" alt="BETTER project logo" class="logo-right">
</header>
  <main class="container">

    <section class="intro">
      This application was designed by the BETTER Team, which includes teachers and trainers from Croatia, France, Italy, Romania and Spain.
    </section>
	
	<section class="description">

	<div class="general">
    <label for="country-select">Country</label>
    <select id="country-select" name="country">
        <option value="">-- Choose a country --</option>
        <option value="croatia">Croatia</option>
        <option value="france">France</option>
        <option value="italy">Italy</option>
        <option value="romania">Romania</option>
        <option value="spain">Spain</option>
    </select>
	
	<label for="subject-select">Subject</label>
    <select id="subject-select" name="subject">
        <option value="">-- Choose a subject --</option>
        <option value="literature">Literature</option>
        <option value="maths">Maths</option>
        <option value="PE">Physical Education</option>
        <option value="Science">Science</option>
        <option value="ICT">ICT</option>
		<option value="history">History</option>
        <option value="geography">Geography</option>
        <option value="arts">Arts</option>
        <option value="music">Music</option>
    </select>

    <label>Topic</label>
    <input type="text" id="topic-input" name="topic" placeholder="Enter topic">

	<label for="level-select">Level</label>
    <select id="level-select" name="level">
        <option value="">-- Average level of the students --</option>
        <option value="pa1">pre-A1</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
		<option value="C1">C1</option>
        <option value="C2">C2</option>
    </select>

      </div>
    </section>

    <section class="buttons">

      <a href="linguistic.html" class="btn" onclick="openMethodologyPreview(event, 'linguistic')"><img src="IMG/btn-speaking.svg" alt="" class="btn-icon">Linguistic approach</a>
      <a href="problem.html" class="btn" onclick="openMethodologyPreview(event, 'problem')"><img src="IMG/btn-solve.svg" alt="" class="btn-icon">Solve a problem</a>
      <a href="step.html" class="btn" onclick="openMethodologyPreview(event, 'step')"><img src="IMG/btn-stairs.svg" alt="" class="btn-icon">Step by step</a>

    </section>

    <a href="tips.html" class="tips-link" onclick="tipsLinkClick(event)">
      <svg class="tips-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M9 21h6M10 17v2h4v-2M8 14a5 5 0 1 1 8 0c-.8.9-1.5 1.7-1.5 3h-5c0-1.3-.7-2.1-1.5-3Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Browse all teaching tips
    </a>

    <dialog id="methodology-preview" class="methodology-dialog">
      <div class="methodology-dialog-actions">
        <button type="button" class="dialog-btn dialog-btn-reject" onclick="closeMethodologyPreview()" aria-label="This isn't what I wanted">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="dialog-btn dialog-btn-accept" onclick="confirmMethodologyChoice()" aria-label="Yes, this is what I wanted">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <img id="methodology-preview-image" src="" alt="">
    </dialog>

  </main>

<script src="feature-flags.js"></script>
<script src="context.js"></script>
<script src="methodology-preview.js"></script>
</body>
</html>
